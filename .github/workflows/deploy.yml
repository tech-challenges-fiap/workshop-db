name: Deploy

on:
  push:
    branches:
      - stag
      - prod
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate-ref:
    name: validate ref
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.ref.outputs.deploy_env }}
      github_environment: ${{ steps.ref.outputs.github_environment }}
    steps:
      - name: Validate deploy branch
        id: ref
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            stag)
              echo "deploy_env=stag" >> "${GITHUB_OUTPUT}"
              echo "github_environment=staging" >> "${GITHUB_OUTPUT}"
              ;;
            prod)
              echo "deploy_env=prod" >> "${GITHUB_OUTPUT}"
              echo "github_environment=production" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Deploy is only allowed from stag or prod branches." >&2
              exit 1
              ;;
          esac

  deploy:
    name: deploy
    needs: validate-ref
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validate-ref.outputs.github_environment }}
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DB_ALLOWED_CIDR_BLOCKS: ${{ vars.DB_ALLOWED_CIDR_BLOCKS }}
      DB_ALLOWED_SECURITY_GROUP_IDS: ${{ vars.DB_ALLOWED_SECURITY_GROUP_IDS }}
      DB_MASTER_USERNAME: ${{ vars.DB_MASTER_USERNAME }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_PRIVATE_SUBNET_IDS: ${{ vars.DB_PRIVATE_SUBNET_IDS }}
      DB_VPC_ID: ${{ vars.DB_VPC_ID }}
      DEPLOY_ENV: ${{ needs.validate-ref.outputs.deploy_env }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Prepare backend config
        run: |
          set -euo pipefail

          cat <<EOF > backend.hcl
          bucket       = "${TF_STATE_BUCKET}"
          key          = "${TF_STATE_KEY:-terraform.tfstate}"
          region       = "${AWS_REGION}"
          use_lockfile = true
          EOF

      - name: Prepare Terraform variables
        run: |
          set -euo pipefail

          cat <<EOF > ci.auto.tfvars.json
          {
            "allowed_cidr_blocks": ${DB_ALLOWED_CIDR_BLOCKS:-[]},
            "allowed_security_group_ids": ${DB_ALLOWED_SECURITY_GROUP_IDS:-[]},
            "aws_region": "${AWS_REGION}",
            "db_master_username": "${DB_MASTER_USERNAME:-workshop_admin}",
            "db_name": "${DB_NAME:-workshop}",
            "environment": "${DEPLOY_ENV}",
            "private_subnet_ids": ${DB_PRIVATE_SUBNET_IDS},
            "repo": "db",
            "vpc_id": "${DB_VPC_ID}"
          }
          EOF

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

  stop-staging-after-delay:
    name: stop staging after delay
    needs:
      - validate-ref
      - deploy
    if: ${{ needs.validate-ref.outputs.deploy_env == 'stag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DB_INSTANCE_IDENTIFIER: workshop-db-stag-postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait before stopping staging database
        run: sleep 7200

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Stop staging database
        run: ./scripts/stop-stag-db.sh
